[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconcilex-cli"
version = "1.0.0"
description = "Conservative local CSV transaction reconciliation with an auditable review report"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Cecily Chen"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Accounting",
]

[project.scripts]
reconcilex = "reconcilex.cli:main"

[project.urls]
Repository = "https://github.com/CecilyHere/reconcilex"
Issues = "https://github.com/CecilyHere/reconcilex/issues"

[tool.setuptools.packages.find]
where = ["src"]
